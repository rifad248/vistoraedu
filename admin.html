<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vistora Edu | Admin Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="portal">

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="index.html"><span class="logo-mark">V</span><span>Vistora Edu <span style="display:block;font-size:.58rem;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase">Admin Panel</span></span></a>
    <nav class="nav"><a href="index.html" style="font-weight:700;font-size:.88rem;padding:9px 14px">← Website</a></nav>
  </div>
</header>

<main class="wrap">
<section class="view on" id="view-alogin" data-view="alogin" style="display:block">
  <div class="card" style="max-width:440px;margin:40px auto" id="loginCard">
    <h2 style="font-size:1.3rem">Vistora Admin</h2>
    <p class="muted" style="margin:6px 0 18px">Staff access only — password verified on the server (Google Sheet).</p>
    <form id="adminLoginForm" novalidate>
      <div class="field"><label for="gPass">Admin password</label><input id="gPass" type="password" autocomplete="current-password"></div>
      <div class="err" id="gErr" style="margin-top:12px"></div>
      <button class="btn btn-blue" type="submit" style="width:100%;margin-top:14px">LOGIN</button>
    </form>
    <p class="fnote center" style="margin-top:12px">Default: <b>Vistora@2026</b> — change it in Settings after first login.</p>
  </div>
</section>
<section class="view" id="view-admin" data-view="admin"><div class="stack" id="adminRoot"></div></section>
</main>

<footer><div class="wrap"><span>© <span id="yy">2025</span> Vistora Edu · <a href="index.html">Main Website</a> · <a href="portal.html">Student Portal</a></span></div></footer>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
